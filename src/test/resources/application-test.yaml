## 테스트용 ##

spring:
  # DB
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  #JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  #REDIS
  data:
    redis:
      host: localhost
      port: 6379

# 카카오 로그인
kakao:
  client_id: test-kakao-client-id
  redirect_uri: test-kakao-redirect-uri

# 한국관광공사 Tour API
tour_api:
  key: test-tour-api-key

# 구글맵 API
google_api:
  key: test-google-api-key

# Multipart 파일 업로드 설정
multipart:
  max-file-size: 1MB
  max-request-size: 2MB

# AWS 설정
cloud:
  aws:
    credentials:
      accessKey: test-aws-access-key
      secretKey: test-aws-secret-key
    s3:
      bucketName: test-s3-bucket
    region:
      static: test-region

# 기본 이미지 URL
app:
  default:
    image:
      url: test-default-image-url
